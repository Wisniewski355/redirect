<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://t.me/Wisniewski355">
    <title>Wisniewski355</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1e1e2e, #2a2a40);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .container {
            max-width: 400px;
            padding: 40px 20px;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            background: #229ED9;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 30px rgba(34, 158, 217, 0.3);
        }
        
        h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        
        .username {
            color: #a0a0c0;
            font-size: 18px;
            margin-bottom: 40px;
        }
        
        .button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #229ED9;
            color: white;
            padding: 16px 32px;
            border-radius: 9999px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(34, 158, 217, 0.4);
        }
        
        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(34, 158, 217, 0.5);
        }
        
        .footer {
            margin-top: 50px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">TG</div>
        <h1>Wisniewski355</h1>
        <p class="username">@Wisniewski355</p>
        
        <a href="https://t.me/Wisniewski355" class="button">
            <span>Открыть в Telegram</span>
        </a>
        
        <div class="footer">
            Последнее обновление: <span id="date"></span>
        </div>
    </div>

    <script>
        // Автоматическая переадресация
        setTimeout(() => {
            window.location.href = "https://t.me/Wisniewski355";
        }, 800);

        // Дата обновления
        document.getElementById('date').textContent = new Date().toLocaleDateString('ru-RU', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    </script>
</body>
</html>
